name: Build NIA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout NIA
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f | head -100
            exit 1
          fi

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "Found sdkmanager at: $SDKMANAGER"
          echo "SDKMANAGER_DIR=$SDKMANAGER_DIR" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

      - name: Check Android SDK
        run: |
          echo "Using sdkmanager:"
          which sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install required Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build NIA debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload NIA APK
        uses: actions/upload-artifact@v4
        with:
          name: NIA-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
