name: Build NIA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build debug APK
        env:
          NIA_BACKEND_URL: ${{ secrets.NIA_BACKEND_URL }}
        run: |
          if [ -z "$NIA_BACKEND_URL" ]; then
            echo 'NIA_BACKEND_URL secret is not set.'
            echo 'The build can still run, but the APK will use the Android module default.'
            gradle --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug -PNIA_BACKEND_URL="$NIA_BACKEND_URL"
          fi

      - name: Verify APK exists
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nia-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
